<!--
  sweeptakehub.com — signup OTP
  Supabase → Authentication → Email Templates → Confirm signup → Source

  Subject:
  Your sweeptakehub.com code

  Paste this in Source, not the visual editor.
  The editor preview keeps the words {{ .Token }}.
  A real signup email replaces that with the 6-digit code.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your sweeptakehub.com code</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;font-size:1px;line-height:1px;">
    Your sweeptakehub.com code is {{ .Token }}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f4f5;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;background:#ffffff;border-radius:16px;">
          <tr>
            <td style="padding:32px 28px 8px;text-align:center;">
              <p style="margin:0;font-size:14px;font-weight:700;color:#111111;">sweeptakehub.com</p>
              <h1 style="margin:16px 0 0;font-size:24px;line-height:1.3;font-weight:700;color:#111111;">Verify your email</h1>
              <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#444444;">
                Enter this code on sweeptakehub.com to finish creating your account.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 8px;text-align:center;">
              <p style="margin:0;font-size:32px;font-weight:700;letter-spacing:0;color:#111111;">{{ .Token }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 32px;text-align:center;">
              <p style="margin:0;font-size:13px;line-height:1.5;color:#666666;">This code expires soon and works once.</p>
              <p style="margin:16px 0 0;font-size:13px;line-height:1.5;color:#666666;">
                If you did not sign up, you can ignore this email.
              </p>
              <p style="margin:12px 0 0;font-size:13px;">
                <a href="https://sweeptakehub.com" style="color:#111111;font-weight:700;text-decoration:none;">sweeptakehub.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
